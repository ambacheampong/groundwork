<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C45C3A" />
    <title>Groundwork</title>
    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #F7F3EF;
        color: #2C2C2C;
        text-align: center;
      }
      .wrap { padding: 2rem; }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(196, 92, 58, 0.18);
      }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.25rem; letter-spacing: -0.02em; }
      p { color: #6B6B6B; margin: 0 0 1.5rem; font-size: 0.95rem; }
      button {
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        border: none;
        background: #C45C3A;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="./app-icon.png" alt="Groundwork" class="logo" />
      <h1>Groundwork</h1>
      <p>Connect to the internet to load the app.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
